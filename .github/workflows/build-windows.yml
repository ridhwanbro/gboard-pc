name: Build GBoard PC for Windows
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  create:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run smoke tests
        run: python test_corrections.py
      - name: Compile sources
        run: python -m py_compile gboard_pc_system.py avro_support.py test_corrections.py
      - name: Work around missing Avro version metadata for PyInstaller hook
        shell: pwsh
        run: |
          $avroDir = Join-Path (python -c "import site; print(site.getsitepackages()[0])") "avro"
          if (Test-Path $avroDir) {
            Set-Content -Path (Join-Path $avroDir "VERSION.txt") -Value "packaged by avro-py" -Encoding utf8
          }
      - name: Build executable
        run: python -m PyInstaller --clean --onefile --windowed --additional-hooks-dir hooks --collect-all avro --collect-all spellchecker --name GBoard_PC gboard_pc_system.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBoard_PC-Windows-x64
          path: dist/GBoard_PC.exe
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'create' && startsWith(github.ref, 'refs/heads/release/v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download built executable
        uses: actions/download-artifact@v4
        with:
          name: GBoard_PC-Windows-x64
          path: dist
      - name: Publish the Windows executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF.StartsWith("refs/heads/release/")) {
            $tagName = $env:GITHUB_REF.Substring("refs/heads/release/".Length)
          } else {
            $tagName = $env:GITHUB_REF_NAME
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/$env:REPOSITORY/releases/tags/$tagName"
          try {
            $release = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers -ErrorAction Stop
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $body = @{
              tag_name = $tagName
              target_commitish = $env:GITHUB_SHA
              name = "GBoard PC $tagName for Windows"
              body = "Avro Roman Bangla now replaces the typed word before inserting its space or punctuation. Enable Avro Bangla mode to start typing; click Apply only for the floating keyboard."
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/releases" -Headers $headers -ContentType "application/json" -Body $body
          }
          $assetUri = "https://uploads.github.com/repos/$env:REPOSITORY/releases/$($release.id)/assets?name=GBoard_PC.exe"
          $asset = Invoke-RestMethod -Method Post -Uri $assetUri -Headers $headers -InFile "dist/GBoard_PC.exe" -ContentType "application/octet-stream"
          Write-Output "Published $($asset.browser_download_url)"

