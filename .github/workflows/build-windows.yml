name: Build Gboard PC for Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the build to
        required: true
        type: string
      source_ref:
        description: Branch or tag containing the app source
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check out selected source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install pyinstaller pystray pillow

      - name: Build one-file Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Gboard_PC --distpath dist --workpath build --specpath build --collect-all pystray --collect-all PIL GboardPC.py

      - name: Attach executable, source and license to the release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            dist/Gboard_PC.exe
            GboardPC.py
            LICENSE-GPL-3.0.txt
          fail_on_unmatched_files: true
          overwrite_files: true
