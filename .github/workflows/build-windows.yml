name: Build GBoard PC for Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run smoke tests
        run: python test_corrections.py
      - name: Compile sources
        run: python -m py_compile gboard_pc_system.py avro_support.py test_corrections.py
      - name: Work around missing Avro version metadata for PyInstaller hook
        shell: pwsh
        run: |
          $avroDir = Join-Path (python -c "import site; print(site.getsitepackages()[0])") "avro"
          if (Test-Path $avroDir) {
            Set-Content -Path (Join-Path $avroDir "VERSION.txt") -Value "packaged by avro-py" -Encoding utf8
          }
      - name: Build executable
        run: python -m PyInstaller --clean --onefile --windowed --name GBoard_PC gboard_pc_system.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBoard_PC-Windows-x64
          path: dist/GBoard_PC.exe
          if-no-files-found: error
